<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maths Videos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #005b94;
            --background-color: #f0f4f8;
            --text-color: #333;
            --header-color: #002d4a;
            --card-bg: #ffffff;
            --border-radius: 10px;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        [hidden] { display: none !important; }

        html.viewer-open { overflow: hidden; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            text-align: center;
            line-height: 1.6;
        }

        .container {
            max-width: 960px;
            margin: 2rem auto;
            background: var(--card-bg);
            padding: 2rem 3rem 3rem 3rem;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        h1 {
            font-family: 'Roboto Slab', serif;
            color: var(--header-color);
            font-size: 2.4em;
            margin-bottom: 0.5em;
        }

        .subtitle {
            font-size: 1.05em;
            color: #555;
            margin: 0 0 1.5rem;
        }

        .topbar {
            position: sticky;
            top: 0.75rem;
            z-index: 50;
            margin-bottom: 1.25rem;
            padding: 0.9rem 1.1rem;
            border: 1px solid rgba(255,255,255,0.65);
            border-radius: 999px;
            background: rgba(255,255,255,0.74);
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(16, 36, 58, 0.08);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .topbar-title {
            font-family: 'Roboto Slab', serif;
            font-size: 1.25rem;
            color: var(--header-color);
            margin: 0;
            white-space: nowrap;
            text-decoration: none;
            font-weight: 700;
        }

        .topbar-nav {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .topbar-link {
            text-decoration: none;
            color: #334155;
            font-weight: 600;
            padding: 0.45rem 0.8rem;
            border-radius: 999px;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .topbar-link:hover,
        .topbar-link.active {
            background-color: #005b94;
            color: #ffffff;
        }

        /* Filters */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin: 0 0 0.75rem;
        }

        .filter-btn {
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            color: #334155;
            background: #ffffff;
            border: 1px solid #d0d9e3;
            border-radius: 999px;
            padding: 0.55rem 1.1rem;
            min-height: 44px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .filter-btn:hover {
            background: rgba(0, 91, 148, 0.08);
            border-color: rgba(0, 91, 148, 0.35);
        }

        .filter-btn[aria-pressed="true"] {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: #ffffff;
        }

        .filter-btn:focus-visible,
        .video-open:focus-visible::after,
        .viewer__close:focus-visible {
            outline: 3px solid #19a7ce;
            outline-offset: 2px;
        }

        .video-status {
            margin: 0 0 1.25rem;
            font-size: 0.9rem;
            color: #5b6b7d;
        }

        .video-empty {
            color: #555;
            margin: 2rem 0 0;
        }

        /* Cards */
        .video-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.5rem;
            text-align: left;
        }

        .video-card {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid #e0e0e0;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
        }

        .video-thumb {
            position: relative;
            aspect-ratio: 16 / 9;
            background: #dbe7f1;
            overflow: hidden;
        }

        .video-thumb__img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-thumb--placeholder {
            display: flex;
            align-items: flex-end;
            padding: 0.9rem 1rem;
            background:
                linear-gradient(rgba(255,255,255,0.12) 1px, transparent 1px) 0 0 / 28px 28px,
                linear-gradient(90deg, rgba(255,255,255,0.12) 1px, transparent 1px) 0 0 / 28px 28px,
                linear-gradient(135deg, #005b94, #19a7ce);
        }

        .video-thumb__topic {
            font-family: 'Roboto Slab', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
            text-shadow: 0 1px 3px rgba(0, 45, 74, 0.35);
        }

        .video-thumb__play {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 3.5rem;
            height: 3.5rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.95);
            color: var(--primary-color);
            box-shadow: 0 6px 18px rgba(0, 45, 74, 0.25);
            transform: translate(-50%, -50%);
            transition: transform 0.2s ease;
        }

        .video-thumb__play svg {
            width: 1.6rem;
            height: 1.6rem;
            fill: currentColor;
        }

        .video-card:hover .video-thumb__play {
            transform: translate(-50%, -50%) scale(1.08);
        }

        .video-thumb__duration {
            position: absolute;
            right: 0.6rem;
            bottom: 0.6rem;
            padding: 0.1rem 0.5rem;
            border-radius: 999px;
            background: rgba(0, 45, 74, 0.85);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .video-body {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
            padding: 1rem 1.25rem 1.25rem;
        }

        .video-meta {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .year-badge {
            padding: 0.15rem 0.7rem;
            border-radius: 999px;
            background: rgba(11, 110, 168, 0.1);
            color: var(--primary-color);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .video-topic {
            color: #5b6b7d;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .video-title {
            margin: 0;
            font-size: 1.15rem;
            line-height: 1.35;
        }

        /* The title button stretches over the whole card so the entire card is clickable. */
        .video-open {
            all: unset;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
        }

        .video-open::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--border-radius);
        }

        .video-desc {
            margin: 0;
            color: #666;
            font-size: 0.95em;
        }

        /* Viewer */
        .viewer {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            max-width: none;
            max-height: none;
            margin: 0;
            padding: 1rem;
            border: 0;
            background: transparent;
            color: var(--text-color);
        }

        .viewer[open] {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .viewer::backdrop {
            background: rgba(0, 29, 48, 0.6);
        }

        .viewer__panel {
            box-sizing: border-box;
            width: min(960px, 100%);
            max-height: 100%;
            overflow-y: auto;
            padding: 1.25rem 1.5rem 1.5rem;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 18px 48px rgba(16, 36, 58, 0.3);
            text-align: left;
        }

        .viewer__head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 0.9rem;
        }

        .viewer__title {
            margin: 0.35rem 0 0;
            font-family: 'Roboto Slab', serif;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            line-height: 1.25;
            color: var(--header-color);
        }

        .viewer__close {
            flex: none;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border: 1px solid #d0d9e3;
            border-radius: 50%;
            background: #ffffff;
            color: #334155;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .viewer__close:hover { background: rgba(0, 91, 148, 0.08); }

        .viewer__close svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            fill: none;
        }

        /* Fit the 16:9 frame inside the available viewport height as well as width. */
        .viewer__frame {
            position: relative;
            width: min(100%, calc((100vh - 11rem) * 16 / 9));
            min-width: min(100%, 240px);
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .viewer__video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: #000;
        }

        .viewer__error {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 1rem;
            text-align: center;
            color: #ffffff;
            background: #10243a;
        }

        .viewer__desc {
            margin: 0.9rem 0 0;
            color: #555;
        }

        @media (max-width: 720px) {
            body { padding: 1rem 0.5rem; }
            .container { padding: 1.5rem 1rem 2rem; margin: 1rem auto; }
            h1 { font-size: 2em; }
            .topbar { border-radius: 24px; }
            .topbar-inner { justify-content: center; }
            .video-list { grid-template-columns: 1fr; }
            .viewer { padding: 0.5rem; }
            .viewer__panel { padding: 1rem; }
            .viewer__frame { width: min(100%, calc((100vh - 10rem) * 16 / 9)); }
        }

        @media (prefers-reduced-motion: reduce) {
            .video-card, .video-thumb__play, .filter-btn { transition: none; }
            .video-card:hover { transform: none; }
            .video-card:hover .video-thumb__play { transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="topbar-brand">
                <a href="../" class="topbar-title">Mr Deng Maths</a>
                <nav class="topbar-nav" aria-label="Primary navigation">
                    <a href="../app/" class="topbar-link">Apps</a>
                    <a href="../quiz/" class="topbar-link">Quiz</a>
                    <a href="../worksheet/" class="topbar-link">Worksheet</a>
                    <a href="./" class="topbar-link active">Videos</a>
                    <a href="../explore/" class="topbar-link">Explore</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container">
        <h1>Videos</h1>
        <p class="subtitle">Short videos to help you learn and revise key maths ideas.</p>

        <div class="filter-bar" id="videoFilters" role="group" aria-label="Filter videos by year level" hidden></div>
        <p class="video-status" id="videoStatus" role="status" aria-live="polite"></p>

        <ul class="video-list" id="videoGrid" aria-label="Videos"></ul>
        <p class="video-empty" id="videoEmpty" hidden>Videos are coming soon.</p>
    </main>

    <dialog class="viewer" id="viewer" aria-labelledby="viewerTitle">
        <div class="viewer__panel">
            <div class="viewer__head">
                <div>
                    <span class="year-badge" id="viewerBadge"></span>
                    <h2 class="viewer__title" id="viewerTitle"></h2>
                </div>
                <button type="button" class="viewer__close" id="viewerClose" aria-label="Close video">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5l14 14M19 5L5 19"/></svg>
                </button>
            </div>
            <div class="viewer__frame">
                <video class="viewer__video" id="viewerVideo" controls preload="metadata" playsinline></video>
                <p class="viewer__error" id="viewerError" role="alert" hidden>Sorry, this video could not be loaded. Please try again later.</p>
            </div>
            <p class="viewer__desc" id="viewerDesc"></p>
        </div>
    </dialog>

    <script src="../site-nav.js"></script>
    <script src="./videos-data.js?v=20261021-1"></script>
    <script src="./videos.js"></script>
</body>
</html>
