                                <span className="text-[11px] text-gray-300 font-bold tracking-wider">FABRICATION BAY · CLONE</span>
                                <div className="flex gap-1">
                                    {[...new Set(q.slots.map(slotType))].map(t => (
                                        <span key={t} className={`text-[10px] font-bold px-2 py-0.5 rounded ${t === 'ang' ? 'bg-yellow-900 text-yellow-200' : t === 'area' ? 'bg-purple-900 text-purple-200' : 'bg-blue-900 text-blue-200'}`}>
                                            {t === 'ang' ? 'ANGLE' : t === 'area' ? 'AREA' : 'SIDES'}
                                        </span>
                                    ))}
                                </div>
                            </div>

                            <div key={shakeKey} className={`w-full ${cloneBox} mx-auto px-2 relative ${status === 'error' ? 'shake' : ''}`}>
                                <TrianglePlate q={q} mode="clone" values={values} selectedSlot={selectedSlot}
                                               wrongSlots={wrongSlots} success={success} onSlot={handleSlotClick} />
                                {success && (
                                    <div className="absolute top-2 right-2 stamp border-4 border-green-400 text-green-300 rounded px-2 py-1 font-bold text-sm bg-black/50 pointer-events-none">
                                        QC ✓ PASSED
                                    </div>
                                )}
                            </div>

                            <div className="w-full"><div className={`conveyor ${success ? 'fast' : ''}`} /></div>

                            <div className="w-full px-3 py-3 flex flex-wrap gap-3 items-center justify-center bg-gray-900/60">
                                {!success ? (
                                    <>
                                        <button onClick={checkSimilarity}
                                            className="px-6 py-2 font-bold rounded shadow-lg transition-transform bg-green-600 hover:bg-green-500 text-white hover:scale-105 border-b-4 border-green-800 active:border-b-0 active:translate-y-1">
                                            ⚙ FABRICATE
                                        </button>
                                        <button onClick={giveHint}
                                            className="px-4 py-2 font-bold rounded bg-gray-700 hover:bg-gray-600 border border-yellow-600/60 text-yellow-200 text-sm">
                                            💡 HINT (−${HINT_COST})
                                        </button>
                                    </>
                                ) : (
                                    <button onClick={nextPart}
                                        className="px-6 py-2 font-bold rounded shadow-lg bg-blue-600 hover:bg-blue-500 text-white hover:scale-105 transition-transform border-b-4 border-blue-800">
                                        {qIdx < roundData.length - 1 ? 'NEXT WORK ORDER →' : currentRound < 3 ? 'FINISH ROUND →' : 'COMPLETE SHIFT →'}
                                    </button>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* ---------- Supervisor panel / QC report ---------- */}
                    <div className="w-full max-w-6xl mt-3 min-h-[44px]">
                        {message && (
                            <div className={`border rounded-lg px-3 py-2 text-sm slide-in ${msgTone[message.tone]}`}>
                                <span className="font-bold mr-2">{message.tone === 'success' ? 'QC REPORT' : message.tone === 'error' ? 'INSPECTION' : message.tone === 'hint' ? 'SUPERVISOR' : 'NOTE'}:</span>
                                <MathText text={message.text} wrap />
                                {success && (
                                    <div className="mt-2 grid sm:grid-cols-2 gap-1">
                                        {q.slots.map(s => (
                                            <div key={s} className="bg-black/30 rounded px-2 py-1 text-green-100">
                                                <span className="text-green-400 font-bold">{SLOT_NAMES[s]}: </span>
                                                <MathText text={q.working[s]} wrap />
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                        {!message && (
                            <div className="text-center text-xs text-gray-500 pt-3">
                                {selectedSlot ? <span className="text-yellow-300">Installing into {SLOT_NAMES[selectedSlot]} – it matches {PROTO_NAMES[selectedSlot]} on the prototype. Pick a part below.</span>
                                    : selectedPart !== null ? <span className="text-yellow-300">Part picked up – now tap a socket on the clone.</span>
                                    : 'Tap a socket on the clone or a part in the bin to begin.'}
                            </div>
                        )}
                    </div>

                    {/* ---------- Parts bin ---------- */}
                    <div className="w-full max-w-6xl mt-2 mb-4 rounded-xl overflow-hidden border border-gray-700 bg-gray-800/90">
                        <div className="flex justify-between items-center px-3 py-1.5 bg-gray-900 border-b border-gray-700">
                            <h3 className="text-gray-300 text-xs font-bold tracking-widest uppercase">Parts bin</h3>
                            <span className="text-[10px] text-gray-500">Tap a part in a socket to remove it</span>
                        </div>
                        <div className="flex flex-wrap gap-3 justify-center p-4"
                             style={{ backgroundImage: 'repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 12px)' }}>
                            {q.inventory.map((item, idx) => (
                                <PartChip key={idx} value={item}
                                          used={usedIdx.includes(idx)}
                                          selected={selectedPart === idx}
                                          disabled={success || usedIdx.includes(idx)}
                                          onClick={() => handlePartClick(idx)} />
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
