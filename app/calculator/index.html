<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fx-8200 AU II ClassWiz Simulator</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9ecf1;display:flex;flex-direction:column;align-items:center;font-family:Arial,Helvetica,sans-serif;padding:16px 0}
.wrap{position:relative}
.calc{width:400px;background:linear-gradient(170deg,#3b3d42,#2a2c30 40%,#232428);border-radius:34px 34px 48px 48px;padding:20px 20px 26px;
  box-shadow:0 16px 36px rgba(0,0,0,.45),inset 0 0 0 3px #4a4c52,inset 0 2px 0 #66686e;user-select:none;-webkit-user-select:none}
.grip{position:absolute;right:-6px;bottom:-6px;width:36px;height:36px;z-index:10;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 45%,#666 45%,#666 52%,transparent 52%,transparent 62%,#666 62%,#666 69%,transparent 69%,transparent 79%,#666 79%,#666 86%,transparent 86%)}
.brand{color:#fff;font-weight:900;font-size:24px;letter-spacing:1px;margin-left:8px;font-family:"Arial Black",Arial,sans-serif}
.model{color:#e6e6e6;font-size:12.5px;font-weight:bold;margin:3px 0 12px 8px;letter-spacing:.4px}
.bezel{background:#1a1b1e;border-radius:10px;padding:12px 12px 8px}
.cw{color:#d0d0d0;text-align:right;font-size:12px;letter-spacing:5px;margin-top:7px;font-weight:bold}

/* ---------- LCD ---------- */
.lcd{background:linear-gradient(#d4dbcc,#c7cfbd);height:170px;border-radius:3px;box-shadow:inset 0 2px 6px rgba(0,0,0,.45);color:#0d0d0d;position:relative;overflow:hidden;
  font-family:"Segoe UI",Roboto,Arial,sans-serif;font-weight:600}
.lcd.off{background:#b8bfb0}
.st{height:20px;font-size:12px;padding:2px 6px 0;display:flex;align-items:center;font-weight:700;border-bottom:1px solid rgba(0,0,0,.18)}
.st .sl{display:flex;gap:4px;align-items:center}.st .sm{flex:1;text-align:center;font-size:13px}.st .sr{width:14px;text-align:right}
.st .inv{background:#111;color:#d4dbcc;padding:0 3px;border-radius:2px;line-height:14px}
.st .ic{font-size:11px}
.main{position:relative;height:148px;padding:4px 9px;font-size:19px;line-height:24px}
.inp{font-size:24px;line-height:normal;max-height:92px;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;letter-spacing:.3px}
.inp .fr{font-size:.82em}
.res{position:absolute;right:10px;bottom:6px;font-size:28px;text-align:right;max-width:340px;white-space:nowrap;font-weight:700}
.res .fr{font-size:.8em}
.ph{display:inline-block;width:.6em;height:.85em;border:1.5px dotted #222;vertical-align:middle;margin:0 2px;position:relative;box-sizing:border-box}
.ph .cur{position:absolute;left:1px;top:1px;bottom:1px;height:auto;margin:0}
.cur{display:inline-block;width:2px;height:1em;background:#000;vertical-align:-.15em;animation:bl 1s steps(1) infinite;margin:0 -1px}
.cur.ov{width:12px;height:3px;vertical-align:-5px}
@keyframes bl{50%{opacity:0}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15em;margin:0 3px}
.fr>span{display:flex;justify-content:center;align-items:center;padding:0 3px}
.fr>span:first-child{padding-bottom:3px}.fr>span:last-child{padding-top:4px}
.fr>span:first-child{border-bottom:2px solid #111}
.sq{display:inline-flex;align-items:flex-start;white-space:nowrap}.sqb{border-top:2px solid #111;padding:0 2px;margin-top:3px;display:inline-flex;align-items:center}
.ri{font-size:.55em;margin-right:-5px;align-self:flex-start}.pw{font-size:.62em;vertical-align:.75em;display:inline-flex;align-items:center}.lb{font-size:.62em}
.bop{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1em;margin-right:1px}.bop .bu,.bop .bl{font-size:.55em}.bop .bs{font-size:1.15em}
.ovl{text-decoration:overline;text-decoration-thickness:2px}
.x10 sup,.res sup{font-size:.6em}
.neg{font-size:.85em;vertical-align:2px}
.pc{font-weight:700}
sup{font-size:.62em}
.mt{font-size:15px;font-weight:800;border-bottom:1.5px solid #333;margin-bottom:2px;height:23px;line-height:22px}
.mi,.li{height:30px;line-height:30px;padding:0 4px;white-space:nowrap;overflow:hidden;display:flex;align-items:center;font-size:19px;margin-right:9px}
.mi.sel{background:#111;color:#d4dbcc}
.mn{margin-right:5px;font-size:17px}
.ml{overflow:hidden;text-overflow:ellipsis}
.mv,.lv{margin-left:auto;padding-left:6px}
.fe{margin-left:6px}
.ma{margin-left:auto;padding-left:6px}
.mv+.ma{margin-left:6px}
.mi.exe .ml{font-weight:800}
.sb{position:absolute;right:2px;top:4px;bottom:4px;width:5px;border:1px solid #333}
.sb div{position:absolute;left:0;right:0;background:#111}
.err{text-align:center;padding-top:10px;font-size:18px;line-height:28px}
.err b{font-size:22px;display:block;margin-bottom:4px}
.home{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-top:4px}
.tile{text-align:center;font-size:16px;line-height:19px;padding:4px 0;border-radius:3px;position:relative}
.tile.sel{background:#111;color:#d4dbcc}
.tile .tn{position:absolute;right:6px;top:2px;font-size:15px}
.tile svg{width:34px;height:26px;display:block;margin:0 auto 4px}
table.dt{border-collapse:collapse;font-size:17px;width:calc(100% - 4px)}
table.dt td,table.dt th{border:1px solid #555;padding:0 5px;height:25px;text-align:right;white-space:nowrap;overflow:hidden;max-width:130px}
table.dt th{text-align:center;font-size:15px}
table.dt td.sel{background:#111;color:#d4dbcc}
table.dt td.n{width:26px;text-align:center;font-size:13px}
.bot{position:absolute;left:8px;right:8px;bottom:3px;font-size:20px;border-top:1.5px solid #333;white-space:nowrap;overflow:hidden;display:flex;align-items:center;min-height:30px;background:#ccd3c3}
.vg{display:grid;grid-template-columns:1fr 1fr;column-gap:8px;font-size:17px}
.vc{height:27px;line-height:27px;padding:0 4px;white-space:nowrap;overflow:hidden}
.vc.sel{background:#111;color:#d4dbcc}
.cg{display:grid;grid-template-columns:repeat(3,1fr);font-size:15px}
.cc{height:24px;line-height:24px;padding:0 3px;white-space:nowrap;overflow:hidden}
.cc.sel{background:#111;color:#d4dbcc}
.pgn{position:absolute;right:6px;bottom:2px;font-size:11px}
.none{font-size:18px;line-height:30px;padding-top:6px}
.none small{font-size:14px}
/* large text option */
.lcd.big .main{font-size:22px}
.lcd.big .inp{font-size:30px}.lcd.big .res{font-size:34px}
.lcd.big .mi,.lcd.big .li{height:40px;line-height:40px;font-size:23px}
.lcd.big table.dt{font-size:20px}.lcd.big table.dt td{height:32px}
.lcd.big .tile{font-size:15px}

/* ---------- keys ---------- */
.top{position:relative;height:160px;margin-top:14px}
.k{position:absolute;display:flex;flex-direction:column;align-items:center;width:50px}
.tl{font-size:9px;color:#fff;font-weight:800;height:15px;white-space:nowrap;letter-spacing:0}
.tl.blue,.blue{color:#3ea0ff!important}
.btn{cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;transition:transform .05s,filter .05s;box-shadow:0 3px 0 rgba(0,0,0,.55)}
.btn.pr{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.55);filter:brightness(.82)}
.onk{width:32px;height:26px;border-radius:50%;background:#0d0d0f;border:1.5px solid #555;margin-top:2px}
.nav{width:44px;height:32px;border-radius:50%;background:#25262a;border:1.5px solid #4c4e54}
.lt{width:44px;height:32px;border-radius:50%;background:#e8e9eb;color:#1e1e1e;font-size:16px}
.sh{width:44px;height:32px;border-radius:50%;background:#1d5fe0}
.sh.on{background:#5aa2ff;box-shadow:0 0 10px #5aa2ff}
.pb{position:absolute;width:40px;height:40px;border-radius:50%;background:#25262a;border:1.5px solid #4c4e54;color:#fff}
.okb{font-size:16px;color:#fff}
.scroll{position:absolute;left:300px;top:6px;width:46px;height:100px;border-radius:23px;background:#25262a;border:1.5px solid #4c4e54;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.55)}
.sch{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.sch:active{background:#3a3b40}
.dots{letter-spacing:-1px;font-size:15px}
.grid6{display:grid;grid-template-columns:repeat(6,1fr);row-gap:2px;margin-top:4px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);row-gap:2px;margin-top:6px}
.cell{display:flex;flex-direction:column;align-items:center}
.slab{height:27px;width:100%;position:relative;padding-left:5px}
.st2{color:#3ea0ff;font-weight:800;font-size:14px;line-height:15px;white-space:nowrap;display:block}
.st2 sup{font-size:.7em;vertical-align:.45em}
.two{display:inline-block;font-size:11px;line-height:10.5px}
.brk{position:absolute;left:6px;bottom:1px;width:6px;height:6px;border-left:1.6px solid #3ea0ff;border-bottom:1.6px solid #3ea0ff}
.cell:has(.two) .brk{display:none}
.mfr{display:inline-flex;flex-direction:column;font-size:.85em;line-height:.85em;vertical-align:middle}.mfr span:first-child{border-bottom:1.5px solid #3ea0ff}
.off{background:#2f8cff;color:#fff;border-radius:4px;padding:0 4px;font-size:12px}
.slab:has(.off) .brk{display:none}
.slab:has(.off){padding-left:14px}
.fk{width:46px;height:34px;border-radius:50%;background:#e8e9eb;color:#1a1a1a;font-size:17px}
.kf{font-size:16px;font-weight:700}.kf sup{font-size:.68em}.sm2{font-size:13px}
.vx{font-family:"Times New Roman",serif;font-size:24px;font-weight:600}
.nk{width:60px;height:46px;border-radius:50%;background:#efeff1;color:#141414;font-size:27px;font-weight:600}
.nk.txt{font-size:18px;font-weight:800}
.k10{font-size:17px}.k10 sup{font-size:.65em}
.kfmt{font-size:10.5px;font-weight:900;letter-spacing:-.2px}
.cyc{font-size:17px}
.calc.shifted .st2{color:#7cc2ff;text-shadow:0 0 6px rgba(80,160,255,.8)}
.foot{color:#555;font-size:12px;margin-top:14px;text-align:center;max-width:440px;line-height:17px}

/* ===================== SKIN VARIABLES & ACCURATE PRINTING ===================== */
:root{--page:#e9ecf1;--leg:#3ea0ff;--print:#fff}
body{background:var(--page);transition:background .2s}
.calc{background:linear-gradient(170deg,var(--c1),var(--c2));box-shadow:0 16px 36px rgba(0,0,0,.4),inset 0 0 0 3px var(--edge),inset 0 2px 0 rgba(255,255,255,.18)}
.brand,.model{color:var(--brand)} .cw{color:var(--brand);opacity:.8}
.bezel{background:var(--bez)}
.lcd{background:linear-gradient(var(--l1),var(--l2));color:var(--ink)}
.st{border-bottom-color:currentColor}
.st .inv,.mi.sel,.tile.sel,table.dt td.sel,.vc.sel,.cc.sel{background:var(--ink);color:var(--l1)}
.fr>span:first-child{border-bottom-color:currentColor}.sqb{border-top-color:currentColor}
.ph{border-color:currentColor}.cur{background:currentColor}
.mt,.bot{border-color:currentColor}.bot{background:var(--l2)}
table.dt td,table.dt th{border-color:currentColor}
.sb{border-color:currentColor}.sb div{background:currentColor}
.tl{color:var(--print);font-size:9px;letter-spacing:0}
.tl.blue,.blue{color:var(--leg)!important}
.btn{box-shadow:var(--kshadow);border:var(--olw) solid var(--ol)}
.nav,.pb,.scroll,.onk{background:var(--nav);color:var(--navI);border:1.5px solid var(--navE)}
body.cartoon .nav,body.cartoon .pb,body.cartoon .scroll,body.cartoon .onk{border:2px solid #111}
.okb{color:var(--navI)}
.sch:active{filter:brightness(.85)}
.lt,.fk{background:var(--fn);color:var(--fnI)}
.nk.kdig{background:var(--dig);color:var(--digI)}
.nk.kop{background:var(--op);color:var(--opI)}
.nk.kdel{background:var(--del);color:var(--delI)}
.nk.kac{background:var(--ac);color:var(--acI)}
.nk.kexe{background:var(--exe);color:var(--exeI)}
.sh{background:var(--sh);color:var(--shI)}
.sh.on{filter:brightness(1.3);box-shadow:0 0 12px var(--leg)}


/* shift legends: printed top-left of each key with an └ leader into the key */
.cell{position:relative}
.slab{height:26px;padding-left:2px;position:relative;z-index:2;pointer-events:none}
.st2{color:var(--leg);font-family:"Arial Narrow","Roboto Condensed",Arial,sans-serif;font-weight:700;font-size:15px;line-height:16px;letter-spacing:-.2px;display:inline-block;height:17px;white-space:nowrap}
.st2 i{font-family:"Times New Roman",serif;font-size:17px;font-weight:700}
.st2 sup{font-size:.62em;vertical-align:.5em;line-height:0;margin-left:1px}
.st2 .sg{display:inline-block;vertical-align:bottom}
.two{font-size:11px;line-height:9.5px;font-weight:800;margin-bottom:-1px}
.dms{font-size:17px;letter-spacing:1px}
.brk{position:absolute;left:3px;top:18px;width:9px;height:15px;border-left:1.7px solid var(--leg);border-bottom:1.7px solid var(--leg);border-color:var(--leg)}
.grid5 .brk{left:3px;top:18px;height:19px;width:10px}
.cell:has(.two) .brk{top:20px;height:12px}
.off{background:var(--leg);color:var(--c2);border-radius:3px;padding:0 4px;font-size:12px;font-weight:900;line-height:15px}
.slab:has(.off){padding-left:12px}
.calc.shifted .st2{color:var(--leg);filter:brightness(1.35);text-shadow:0 0 6px var(--leg)}
.calc.shifted .brk{filter:brightness(1.35)}

/* mode chips */
.chips{display:flex;gap:6px;align-items:center;margin:10px 4px -6px}
.chips button{font:800 11px Arial,sans-serif;letter-spacing:.4px;border:none;border-radius:11px;padding:4px 9px;cursor:pointer;background:rgba(127,127,127,.28);color:var(--print)}
.chips button:hover{filter:brightness(1.2)}
.chips .ico{background:transparent;padding:0 2px;color:var(--print);display:flex}

/* skin picker */
.skmodal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50}
.skmodal.show{display:flex}
.skbox{background:#fff;color:#222;width:min(900px,94vw);max-height:90vh;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;font-family:Arial,sans-serif}
.skhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-size:19px;border-bottom:1px solid #eee}
.skx{border:1px solid #ccc;background:#fff;border-radius:8px;width:34px;height:34px;font-size:16px;cursor:pointer}
.sktabs{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap;border-bottom:1px solid #eee}
.sktabs button{border:1px solid #ccc;background:#fff;border-radius:18px;padding:6px 14px;font-size:14px;cursor:pointer}
.sktabs button:hover{border-color:#3a6cf0;color:#3a6cf0}
.skbody{overflow:auto;padding:4px 18px 18px}
.skbody h3{margin:16px 0 8px;font-size:16px}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.skcard{cursor:pointer;border-radius:12px;padding:6px;border:2px solid transparent;text-align:center}
.skcard:hover{background:#f3f5f9}
.skcard.on{border-color:#3a6cf0;background:#eef3ff}
.skn{font-size:14px;font-weight:700;margin-top:6px}
.mini{background:linear-gradient(170deg,var(--c1),var(--c2));border-radius:12px;padding:8px;box-shadow:inset 0 0 0 2px var(--edge)}
.mlcd{background:linear-gradient(var(--l1),var(--l2));color:var(--ink);border-radius:3px;height:44px;padding:3px 6px;display:flex;flex-direction:column;justify-content:space-between;font:600 12px Arial;text-align:left}
.mlcd b{text-align:right}
.mrow{display:flex;gap:5px;justify-content:center;margin-top:6px;align-items:center}
.mk{width:26px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:700 10px Arial;border:var(--olw) solid var(--ol);box-shadow:var(--kshadow)}
.mleg{color:var(--leg);font:italic 700 11px "Times New Roman"}
.skfoot{border-top:1px solid #eee;padding:10px 18px}
.skfoot button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer}
.foot{color:#666}

.tip{position:fixed;width:260px;background:#fffef6;color:#1d1d1d;border:2px solid #333;border-radius:10px;padding:10px 12px;font:14px/1.4 Arial,sans-serif;
  box-shadow:0 6px 18px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s;z-index:40}
.tip.show{opacity:1}
.tip:before{content:"";position:absolute;left:-9px;top:var(--ay,18px);border:8px solid transparent;border-right-color:#333;border-left:0}
.tip h4{margin:0 0 6px;font-size:15px}
.tip ul{margin:0;padding-left:0;list-style:none}
.tip li{margin:4px 0;padding:3px 6px;border-radius:6px}
.tip li.now{background:#e4efff;font-weight:bold}
.tip li b{display:inline-block;min-width:58px}
.tip .hint{margin-top:6px;font-size:12px;color:#555}
.kg{display:block}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="calc" id="calc">
  <div class="brand">CASIO</div>
  <div class="model">fx-8200 AU II</div>
  <div class="bezel">
    <div class="lcd" id="lcd"></div>
    <div class="cw">CLASSWIZ</div>
  </div>
  <div class="chips" id="chips">
    <button data-c="ang" onclick="chipClick('ang')" title="Angle unit">DEG</button>
    <button data-c="io" onclick="chipClick('io')" title="Input/Output">MATH</button>
    <button data-c="fr" onclick="chipClick('fr')" title="Fraction result">FRAC</button>
    <button data-c="nf" onclick="chipClick('nf')" title="Number format">NORM 2</button>
    <span style="flex:1"></span>
    <button class="ico" onclick="toggleSkins(true)" title="Change skin"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 1a9 9 0 0 0 0 18c1.4 0 2-1 1.6-2.1-.5-1.3.3-2.4 1.7-2.4H16a3 3 0 0 0 3-3C19 5 15 1 10 1z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="8" r="1.5" fill="#e5484d"/><circle cx="9.5" cy="5" r="1.5" fill="#f2b705"/><circle cx="14" cy="6.5" r="1.5" fill="#2ecc71"/><circle cx="5.5" cy="12.5" r="1.5" fill="#2f6fdf"/></svg></button>
  </div>
  <div class="top" id="top"></div>
  <div class="grid6" id="g6"></div>
  <div class="grid5" id="g5"></div>
</div><div class="grip" id="grip" title="Drag to resize"></div></div>
<div id="tip" class="tip"></div>
<div id="skinmodal" class="skmodal"></div>
<div class="foot">For classroom learning purposes only · Nov 2026<br>Drag the ◢ corner to resize · Larger screen text: SETTINGS ❷ System Settings<br>
Keyboard: digits + - * / ^ ( ) . &nbsp;Enter = EXE &nbsp;Backspace = DEL &nbsp;Esc = AC &nbsp;arrows &nbsp;O = OK &nbsp;H = HOME &nbsp;S = SHIFT</div>
<script>
/* =====================================================================
   fx-8200 AU II classroom simulator — MATHS ENGINE
   ===================================================================== */
const DEF = {angle:'Deg', fmt:'Norm2', fmtN:2, io:'MM', frac:'imp', cplx:'rect', sep:true, big:false};
let S = {...DEF};
let vars, Ans, PreAns, vectors, stat, FDEF;
function resetMem(){
  vars = {A:C(0),B:C(0),C:C(0),D:C(0),E:C(0),F:C(0),x:C(0),y:C(0),z:C(0)};
  Ans = C(0); PreAns = C(0);
  vectors = {VctA:null,VctB:null,VctC:null,VctAns:null};
}
function resetData(){ stat = {type:'1', freq:true, rows:[]}; FDEF={f:[],g:[]}; }
class CalcErr extends Error{}
const ERR = m => { throw new CalcErr(m); };
const SYN = () => ERR('Syntax ERROR');
const MATH = () => ERR('Math ERROR');

/* ---------- numbers ---------- */
function C(re,im=0){ return {re,im}; }
const isVec = v => v && v.vec;
function clean15(x){ if(!isFinite(x)) return x; if(Math.abs(x)<1e-300) return 0; return Number(x.toPrecision(15)); }
function realOf(v){ if(isVec(v)) MATH(); if(Math.abs(v.im)>1e-12*Math.max(1,Math.abs(v.re))) MATH(); return v.re; }
function add(a,b){ if(isVec(a)||isVec(b)){ if(!(isVec(a)&&isVec(b))||a.vec.length!==b.vec.length) ERR('Dimension ERROR'); return {vec:a.vec.map((x,i)=>x+b.vec[i])}; } return C(a.re+b.re,a.im+b.im); }
function neg(a){ return isVec(a)?{vec:a.vec.map(x=>-x)}:C(-a.re,-a.im); }
function sub(a,b){ return add(a,neg(b)); }
function mul(a,b){
  if(isVec(a)&&isVec(b)){
    if(a.vec.length!==3||b.vec.length!==3) ERR('Dimension ERROR');
    const [p,q,r]=a.vec,[s,t,u]=b.vec; return {vec:[q*u-r*t, r*s-p*u, p*t-q*s]};

const ALLCMD=[['Σ','Σ('],['Π','Π('],['!','<i>x</i>!'],['nPr','P'],['nCr','C'],['%','%'],['Ran#','Ran#'],['RanInt#(','RanInt#('],['GCD(','GCD('],
  ['LCM(','LCM('],['Abs(','Abs('],['Int(','Int('],['Intg(','Intg('],['Rnd(','Rnd('],['÷R','÷R'],
  ['°','°'],['ʳ','ʳ'],['ᵍ','ᵍ'],['DMS','°′″'],['sinh(','sinh('],['cosh(','cosh('],['tanh(','tanh('],['sinh⁻¹(','sinh⁻¹('],['cosh⁻¹(','cosh⁻¹('],['tanh⁻¹(','tanh⁻¹('],
  ['REC','Recur'],['³','<i>x</i>³'],['f(','f('],['g(','g('],['i','<i>i</i>']];
function AllCatalog(){
  const per=15; return {idx:0,
    render(){ const pg=Math.floor(this.idx/per); let h='<div class="cg">';
      ALLCMD.slice(pg*per,pg*per+per).forEach((c,j)=>{ const i=pg*per+j; h+=`<div class="cc${i===this.idx?' sel':''}">${j<9?`<span class="mn">${NUMS[j]}</span>`:''}${c[1]}</div>`; });
      return h+`</div><div class="pgn">${pg+1}/${Math.ceil(ALLCMD.length/per)}</div>`; },
    choose(i){ stack.pop(); const c=ALLCMD[i]; if(c) appScreen().key('tok:'+c[0]); draw(); },
    key(a){ const n=ALLCMD.length, pg=Math.floor(this.idx/per);
      if(a==='RIGHT') this.idx=Math.min(n-1,this.idx+1); else if(a==='LEFT') this.idx=Math.max(0,this.idx-1);
      else if(a==='DOWN') this.idx=Math.min(n-1,this.idx+3); else if(a==='UP') this.idx=Math.max(0,this.idx-3);
      else if(a==='PGDN') this.idx=Math.min(n-1,(pg+1)*per); else if(a==='PGUP') this.idx=Math.max(0,(pg-1)*per);
      else if(a==='OK'||a==='EXE'){ this.choose(this.idx); return; }
      else if(/^tok:[1-9]$/.test(a)){ this.choose(pg*per+(+a.slice(4))-1); return; }
      else if(a==='AC'||a==='BACK'){ stack.pop(); }
      draw(); } };
}

/* ---------- variable memory screen ---------- */
const VLIST=['A','B','C','D','E','F','x','y','z'];
function VarScreen(){
  return {idx:0,ed:null,err:null,
    render(){
      if(this.err) return errHTML(this.err);
      if(this.ed) return `<div class="inp">${dispTok(VLIST[this.idx])}=${this.ed.html(true)}</div>`;
      let h='<div class="vg">';
      VLIST.forEach((n,i)=>{ const v=vars[n]; h+=`<div class="vc${i===this.idx?' sel':''}">${dispTok(n)}=${fmtValue(v,'dec')}</div>`; });
      return h+'</div>'; },
    key(a){
      if(this.err){ if(a==='AC'||a==='LEFT'||a==='RIGHT') this.err=null; draw(); return; }
      if(this.ed){
        if(a.startsWith('tok:')) this.ed.ins(a.slice(4));
        else if(a==='DEL') this.ed.del(); else if(a==='LEFT') this.ed.left(); else if(a==='RIGHT') this.ed.right();
        else if(a==='UP') this.ed.vmove(-1); else if(a==='DOWN') this.ed.vmove(1);
        else if(a==='AC'||a==='BACK') this.ed=null;
        else if(a==='EXE'||a==='OK'){ try{ const v=calc(this.ed.toks(),{complex:appScreen().kind==='cplx'}); if(isVec(v)||v.qr) MATH(); vars[VLIST[this.idx]]=v; this.ed=null; }catch(e){ this.err=e instanceof CalcErr?e.message:'Syntax ERROR'; } }
        draw(); return; }
      if(a.startsWith('tok:')){ this.ed=new Ed(); this.ed.ins(a.slice(4)); }
      else if(a==='LEFT') this.idx=Math.max(0,this.idx-1); else if(a==='RIGHT') this.idx=Math.min(8,this.idx+1);
      else if(a==='UP') this.idx=Math.max(0,this.idx-2); else if(a==='DOWN') this.idx=Math.min(8,this.idx+2);
      else if(a==='OK'||a==='EXE'){ const n=VLIST[this.idx]; stack.pop(); appScreen().key('tok:'+n); return; }
      else if(a==='AC'||a==='BACK'||a==='VARIABLE') stack.pop();
      draw(); } };
}

/* ---------- calculation screen (Calculate / Complex / Vector / Statistics Calc) ---------- */
const OPSTART=new Set(['+','−','×','÷','^(','²','³','⁻¹','!','⁄','nPr','nCr','%','°','ʳ','ᵍ','÷R','DMS','SCI','ŷ','x̂','∠']);
function CalcScreen(kind){
  return {base:true,kind,ed:new Ed(),shown:false,val:null,err:null,hist:[],hi:-1,fmt:'std',verifyOn:false,
    ctx(){ return {complex:kind==='cplx'}; },
    render(){
      if(this.err) return errHTML(this.err);
      let h=`<div class="inp">${this.ed.html(!this.shown)}</div>`;
      if(this.shown) h+=`<div class="res">${fmtValue(this.val,this.fmt)}</div>`;
      return h; },
    exe(approx){
      if(this.ed.empty) return;
      try{ const cx=this.ctx(); const T_=this.ed.toks();
        const v=this.verifyOn?verify(T_,cx):calc(T_,cx);
        if(v.verify!==undefined){}
        else if(v.qr){ PreAns=Ans; Ans=C(v.qr[0]); }
        else if(isVec(v)) vectors.VctAns=[...v.vec];
        else { PreAns=Ans; Ans=v; }
        this.val=v; this.shown=true;
        this.fmt=approx?'dec':(cx.dms&&!isVec(v)&&v.im===0?'dms':'std');
        const j=JSON.stringify(this.ed.root); if(this.hist[this.hist.length-1]!==j) this.hist.push(j);
        if(this.hist.length>30) this.hist.shift();
        this.hi=this.hist.length;
      }catch(e){ this.err=e instanceof CalcErr?e.message:'Syntax ERROR'; if(!(e instanceof CalcErr)) console.error(e); } },
    key(a){
      if(this.err){ if(a==='AC'){ this.err=null; this.ed.load([]); this.shown=false; }
        else if(a==='LEFT'||a==='RIGHT'){ this.err=null; this.shown=false; this.ed.load(this.ed.root); }
        draw(); return; }
      if(a.startsWith('tok:')){ const tk=a.slice(4);
        if(this.shown){ this.shown=false; const A=isVec(this.val)?'VctAns':'Ans';
          if(tk==='⁄'){ const fr=STRUCT['⁄'](); fr.k[0].push(A); this.ed.load([fr]); this.ed.cr=fr.k[1]; this.ed.ci=0; draw(); return; }
          this.ed.load(OPSTART.has(tk)&&this.val.verify===undefined?[A]:[]); }
        this.ed.ins(tk); }
      else switch(a){
        case 'DEL': if(this.shown){ this.shown=false; this.ed.load(this.ed.root); } else this.ed.del(); break;
        case 'INS': this.ed.ov=!this.ed.ov; break;
        case 'AC': this.ed.load([]); this.shown=false; this.hi=this.hist.length; break;
        case 'LEFT': if(this.shown){this.shown=false;this.ed.load(this.ed.root);} else this.ed.left(); break;
        case 'RIGHT': if(this.shown){this.shown=false;this.ed.load(this.ed.root);this.ed.ci=0;} else this.ed.right(); break;
        case 'UP': if(!this.shown&&!this.ed.empty&&this.ed.vmove(-1)) break;
          if(this.hist.length&&this.hi>0&&(this.shown||this.ed.empty)){ this.hi--; this.loadHist(); } break;
        case 'DOWN': if(!this.shown&&!this.ed.empty&&this.ed.vmove(1)) break;
          if(this.shown&&this.hi<this.hist.length-1){ this.hi++; this.loadHist(); } break;
        case 'PGUP': if(this.hist.length){ this.hi=0; this.loadHist(); } break;
        case 'PGDN': if(this.hist.length){ this.hi=this.hist.length-1; this.loadHist(); } break;
        case 'EXE': case 'OK': this.exe(false); break;
        case 'APPROX': this.exe(true); break;
        case 'FORMAT':
          if(!this.shown){ this.exe(false); if(this.shown&&this.val.verify===undefined&&!this.val.qr) this.fmt='dec'; break; }
          if(this.val.verify===undefined&&!this.val.qr) this.fmt=(this.fmt==='std')?'dec':'std'; break;
        case 'FMTMENU':
          if(!this.shown) this.exe(false);
          if(this.shown&&!this.val.qr&&this.val.verify===undefined){ const me=this;
            push(Menu(formatChoices(this.val,kind).map(([l,m])=>({label:l,act:()=>{me.fmt=m;}})))); return; }
          break;
        case 'FUNCTION': push(functionMenu()); return;
        case 'CATALOG': push(Menu(catalogItems(kind))); return;
        case 'ALLCAT': push(AllCatalog()); return;
        case 'VARIABLE': push(VarScreen()); return;
        case 'TOOLS': { const me=this; const items=[];
          if(kind==='vct'){
            const defItems=()=>['VctA','VctB','VctC'].map(n=>({label:n+(vectors[n]?` :${vectors[n].length}D`:''),sub:()=>[{label:'2 Dimensions',act:()=>{ vectors[n]=[0,0]; push(VecEditor(n)); }},{label:'3 Dimensions',act:()=>{ vectors[n]=[0,0,0]; push(VecEditor(n)); }}]}));
            items.push({label:'Define Vector',sub:defItems});
            items.push({label:'Edit Vector',sub:()=>['VctA','VctB','VctC'].map(n=>({label:n+(vectors[n]?'':' (None)'),act:()=>{ if(vectors[n]) push(VecEditor(n)); }}))}); }
          items.push({label:'Delete All History',act:()=>{me.hist=[];me.hi=-1;}});
          if(kind==='calc') items.push({label:me.verifyOn?'Verify OFF':'Verify ON',act:()=>{ me.verifyOn=!me.verifyOn; me.ed.load([]); me.shown=false; }});
          if(kind==='stat') items.push({label:'Back to Data Editor',act:()=>{ stack=[stack[0],statEditor]; }});
          push(Menu(items)); return; }
      }
      draw(); },
    loadHist(){ this.ed.load(JSON.parse(this.hist[this.hi])); this.exe(false); }
  };
}

/* ---------- generic data-entry form (distribution, table range, vectors) ---------- */
function Form(fields,opts={}){
  return {base:!!opts.base,fields,idx:0,tp:0,ed:null,err:null,
    rows(){ return this.fields.length+(opts.exec?1:0); },
    render(){
      if(this.err) return errHTML(this.err);
      const vis=lines()-(this.ed?1:0)-(opts.title?1:0);
      if(this.idx<this.tp) this.tp=this.idx; if(this.idx>=this.tp+vis) this.tp=this.idx-vis+1;
      let h=opts.title?`<div class="mt">${opts.title}</div>`:'';
      for(let i=this.tp;i<Math.min(this.rows(),this.tp+vis);i++){
        if(i===this.fields.length){ h+=`<div class="mi exe${i===this.idx?' sel':''}"><span class="ml">${opts.execLabel||'Execute'}</span></div>`; continue; }
        const f=this.fields[i];
        h+=`<div class="mi${i===this.idx?' sel':''}"><span class="ml">${f.label}</span><span class="fe">:</span><span class="mv">${fmtNum(f.val)}</span></div>`; }
      if(this.ed) h+=`<div class="bot">${this.ed.html(true)}</div>`;
      return h; },
    commit(){
      const f=this.fields[this.idx];
      try{ f.val=evalReal(this.ed.toks()); this.ed=null; if(opts.onCommit) opts.onCommit(this); return true; }
      catch(e){ this.err=e instanceof CalcErr?e.message:'Syntax ERROR'; return false; } },
    key(a){
      if(this.err){ if(a==='AC'||a==='LEFT'||a==='RIGHT'){ this.err=null; } draw(); return; }
      const onField=this.idx<this.fields.length;
      if(a.startsWith('tok:')){ if(!onField) return; if(!this.ed) this.ed=new Ed(); this.ed.ins(a.slice(4)); }
      else switch(a){
        case 'DEL': if(this.ed) this.ed.del(); break;
        case 'AC': if(this.ed) this.ed=null; else if(opts.onAC){ opts.onAC(); return; } break;
        case 'LEFT': if(this.ed) this.ed.left(); break;
        case 'RIGHT': if(this.ed) this.ed.right(); break;
        case 'UP': if(this.ed&&this.ed.vmove(-1)) break; if(this.ed&&!this.commit()) break; this.idx=Math.max(0,this.idx-1); break;
        case 'DOWN': if(this.ed&&this.ed.vmove(1)) break; if(this.ed&&!this.commit()) break; this.idx=Math.min(this.rows()-1,this.idx+1); break;
        case 'EXE': case 'OK':
          if(this.ed){ const last=this.idx===this.fields.length-1; if(this.commit()){ if(last&&opts.exec&&a==='EXE'){ opts.exec(this); break; } this.idx=Math.min(this.rows()-1,this.idx+1); } }
          else if(!onField&&opts.exec) opts.exec(this);
          else if(opts.exec&&a==='EXE'&&this.idx===this.fields.length-1) opts.exec(this);
          else this.idx=Math.min(this.rows()-1,this.idx+1);
          break;
        case 'BACK': if(opts.onBack){ opts.onBack(); return; } stack.pop(); break;
        case 'VARIABLE': push(VarScreen()); return;
        case 'TOOLS': if(opts.tools){ opts.tools(); return; } break;
      }
      draw(); } };
}
function VecEditor(n){

    {title:`${n} (${d}D)`,onCommit:f=>{ vectors[n]=f.fields.map(x=>x.val); },onAC:()=>{ stack.pop(); draw(); }});
}

/* ---------- statistics app ---------- */
let statEditor=null;
function StatEditor(){
  return {base:true,isStat:true,r:0,c:0,tp:0,ed:null,err:null,
    cols(){ const c=['x']; if(stat.type==='2') c.push('y'); if(stat.freq) c.push('f'); return c; },
    render(){
      if(this.err) return errHTML(this.err);
      const R=stat.rows, n=R.length, vis=lines()-1, cols=this.cols();
      if(this.r<this.tp) this.tp=this.r; if(this.r>=this.tp+vis) this.tp=this.r-vis+1;
      const nm={x:'<i>x</i>',y:'<i>y</i>',f:'Freq'};
      let h=`<table class="dt"><tr><th></th>${cols.map(k=>`<th>${nm[k]}</th>`).join('')}</tr>`;
      for(let i=this.tp;i<this.tp+vis;i++){
        if(i>n){ h+=`<tr><td class="n"></td>${cols.map(()=>'<td></td>').join('')}</tr>`; continue; }
        h+=`<tr><td class="n">${i+1}</td>`+cols.map((k,j)=>`<td class="${i===this.r&&j===this.c?'sel':''}">${i<n?fmtNum(R[i][k]):''}</td>`).join('')+'</tr>'; }
      h+='</table>';
      if(this.ed) h+=`<div class="bot">${this.ed.html(true)}</div>`;
      return h; },
    key(a){
      if(this.err){ if(a==='AC'||a==='LEFT'||a==='RIGHT') this.err=null; draw(); return; }
      const R=stat.rows, n=R.length, cols=this.cols();
      if(a.startsWith('tok:')){ if(!this.ed) this.ed=new Ed(); this.ed.ins(a.slice(4)); }
      else switch(a){
        case 'EXE':
          if(this.ed){ try{ const v=evalReal(this.ed.toks());
              if(this.r>=n){ if(cols[this.c]!=='x'&&cols[this.c]!=='y'){ this.ed=null; break; } R.push({x:0,y:0,f:1}); }

function TableApp(){
  return {base:true,isTable:true,rows:[],r:0,c:0,tp:0,ed:null,err:null,
    refresh(){ const cnt=Math.floor((TR.end-TR.start)/TR.step+1e-9)+1; this.rows=[]; for(let i=0;i<cnt;i++) this.rows.push(clean15(TR.start+i*TR.step)); this.r=0; this.tp=0; },

    render(){
      if(this.err) return errHTML(this.err);

        case 'AC': this.ed=null; break;
        case 'UP': this.ed=null; this.r=Math.max(0,this.r-1); break;
        case 'DOWN': this.ed=null; this.r=Math.min(this.rows.length,this.r+1); break;
        case 'PGUP': this.r=Math.max(0,this.r-lines()); break;
        case 'PGDN': this.r=Math.min(this.rows.length,this.r+lines()); break;

        case 'FUNCTION': push(Menu([{label:'Define f(<i>x</i>)',act:()=>push(DefineScreen('f'))},{label:'Define g(<i>x</i>)',act:()=>push(DefineScreen('g'))}])); return;
        case 'VARIABLE': push(VarScreen()); return;

          ])); return; }
      }
      draw(); } };
}

/* ---------- resize by dragging the corner ---------- */
function initResize(){
  const calc=document.getElementById('calc'), grip=document.getElementById('grip');
  let z=1; try{ z=parseFloat(localStorage.getItem('fxzoom'))||1; }catch(e){}
  const apply=()=>{ calc.style.zoom=z; try{ localStorage.setItem('fxzoom',z); }catch(e){} };
  apply();
  let drag=null;
  const start=(x,y)=>{ drag={x,y,z0:z,w:calc.offsetWidth,h:calc.offsetHeight}; document.body.style.cursor='nwse-resize'; };
  const move=(x,y)=>{ if(!drag) return; const dz=Math.max((x-drag.x)/drag.w,(y-drag.y)/drag.h); z=Math.min(2.5,Math.max(0.5,drag.z0+dz)); apply(); };
  const end=()=>{ drag=null; document.body.style.cursor=''; };
  grip.addEventListener('mousedown',e=>{ e.preventDefault(); e.stopPropagation(); start(e.clientX,e.clientY); });
  window.addEventListener('mousemove',e=>{ if(drag){ e.preventDefault(); move(e.clientX,e.clientY); } });
  window.addEventListener('mouseup',end);
  grip.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:false});
  window.addEventListener('touchmove',e=>{ if(drag){ e.preventDefault(); const t=e.touches[0]; move(t.clientX,t.clientY); } },{passive:false});
  window.addEventListener('touchend',end);
}

  const tip=document.getElementById('tip'); let timer=null, curBtn=null;
  const fill=k=>{ const d=TIPS[k], c=d.cur();
    tip.innerHTML=`<h4>${d.t}</h4><ul>${d.o.map(([id,lab,txt])=>`<li class="${id===c?'now':''}"><b>${lab}</b>${id===c?' ✓ now':''}<br>${txt}</li>`).join('')}</ul><div class="hint">Click the button to switch to the next choice.</div>`; };
  const place=b=>{ const r=b.getBoundingClientRect(), calc=document.getElementById('calc').getBoundingClientRect();
    let left=calc.right+14; if(left+270>window.innerWidth) left=Math.max(6,window.innerWidth-272);
    let top=r.top-14; const th=tip.offsetHeight; if(top+th>window.innerHeight-6) top=Math.max(6,window.innerHeight-th-6);
    tip.style.left=left+'px'; tip.style.top=top+'px'; tip.style.setProperty('--ay',Math.max(8,r.top+r.height/2-top-8)+'px'); };
  document.querySelectorAll('#chips button[data-c]').forEach(b=>{
    b.removeAttribute('title');
    b.addEventListener('mouseenter',()=>{ curBtn=b; clearTimeout(timer); timer=setTimeout(()=>{ fill(b.dataset.c); place(b); tip.classList.add('show'); },600); });
    b.addEventListener('mouseleave',()=>{ curBtn=null; clearTimeout(timer); tip.classList.remove('show'); });
    b.addEventListener('click',()=>{ if(tip.classList.contains('show')) setTimeout(()=>{ fill(b.dataset.c); place(b); }); });
  });
})();
</script></body></html>
